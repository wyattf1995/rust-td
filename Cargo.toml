[package]
name = "rust-td"
version = "0.1.0"
edition = "2021"
authors = ["Wyatt Fleming"]
description = "A browser-based tower defense game built with Rust and Bevy"

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "png",
    "webgl2",
] }
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Storage", "Window"] }
console_error_panic_hook = "0.1"
# Force getrandom 0.2 and 0.3 to use js features for wasm
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
# uuid is a transitive dep of bevy_asset — needs js feature for WASM RNG
uuid = { version = "1.20", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
