name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --target wasm32-unknown-unknown

      - name: cargo clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings -A clippy::type_complexity -A clippy::too_many_arguments

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neon-command:ci .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'neon-command:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'
